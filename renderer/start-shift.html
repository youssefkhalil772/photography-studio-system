<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>استوديو التصوير — بدء الشيفت</title>
  <link rel="stylesheet" href="../styles/global.css" />
  <!--
    Direction: Luminous Studio Light Mode (matching login.html)
    Theme: Bright, clean photography studio aesthetic with crisp white card, soft slate backgrounds, and signature Leica red (#E4002B) accents.
  -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #F4F6F9;
      color: #0F172A;
      font-family: 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Subtle Studio Grid lines */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(15, 23, 42, 0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(15, 23, 42, 0.035) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none;
    }

    /* Center Camera Focus Reticle */
    .viewfinder-reticle {
      position: absolute;
      width: 140px;
      height: 140px;
      border: 1px dashed rgba(228, 0, 43, 0.25);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .shift-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Studio Header */
    .studio-brand {
      text-align: center;
      margin-bottom: 22px;
    }

    .brand-aperture-wrap {
      width: 64px;
      height: 64px;
      margin: 0 auto 12px;
      border: 1px solid #E2E8F0;
      border-radius: 18px;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #E4002B;
      box-shadow: 0 4px 16px -2px rgba(15, 23, 42, 0.06);
    }

    .studio-title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: #0F172A;
      margin-bottom: 4px;
    }

    .studio-tagline {
      font-size: 13px;
      font-weight: 600;
      color: #64748B;
    }

    /* Precision Card */
    .shift-card {
      width: 100%;
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 14px;
      padding: 28px 26px;
      box-shadow: 0 20px 45px -10px rgba(15, 23, 42, 0.08), 0 0 1px rgba(15, 23, 42, 0.06);
      position: relative;
    }

    .shift-card::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 24px;
      right: 24px;
      height: 3px;
      background: #E4002B;
      border-radius: 3px 3px 0 0;
    }

    .shift-user-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 20px;
    }

    .shift-user-avatar {
      width: 40px;
      height: 40px;
      background: #0F172A;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 800;
      color: #FFFFFF;
    }

    .shift-user-info h3 {
      font-size: 14px;
      font-weight: 800;
      color: #0F172A;
    }

    .shift-user-info p {
      font-size: 11px;
      font-weight: 700;
      color: #64748B;
      margin-top: 2px;
    }

    .shift-field {
      margin-bottom: 22px;
    }

    .shift-field label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      color: #334155;
      margin-bottom: 8px;
    }

    .shift-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .shift-input {
      width: 100%;
      height: 52px;
      background: #FFFFFF;
      border: 1.5px solid #CBD5E1;
      border-radius: 8px;
      padding: 0 16px;
      font-family: inherit;
      font-size: 22px;
      font-weight: 800;
      color: #0F172A;
      text-align: center;
      outline: none;
      transition: all 0.15s ease;
      font-variant-numeric: tabular-nums;
    }

    .shift-input:focus {
      border-color: #E4002B;
      box-shadow: 0 0 0 3px rgba(228, 0, 43, 0.12);
    }

    .shift-currency-tag {
      position: absolute;
      left: 14px;
      font-size: 13px;
      font-weight: 700;
      color: #64748B;
      pointer-events: none;
    }

    .shift-field-hint {
      font-size: 12px;
      color: #64748B;
      margin-top: 6px;
      font-weight: 500;
      text-align: center;
    }

    .shift-btn {
      width: 100%;
      height: 48px;
      background: #E4002B;
      border: none;
      border-radius: 8px;
      color: #FFFFFF;
      font-family: inherit;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
      box-shadow: 0 4px 14px rgba(228, 0, 43, 0.25);
    }

    .shift-btn:hover {
      background: #CC0026;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(228, 0, 43, 0.35);
    }

    .shift-btn:active {
      transform: translateY(0);
    }

    .shift-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .shift-back-link {
      text-align: center;
      margin-top: 16px;
    }

    .shift-back-link a {
      color: #64748B;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: color 0.15s;
    }

    .shift-back-link a:hover {
      color: #E4002B;
    }

    .shift-time {
      margin-top: 10px;
      text-align: center;
      color: #94A3B8;
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    /* Receipt Print */
    .receipt-print { display: none; }
    @media print {
      html {
        width: 72mm !important;
        min-height: 0 !important;
        height: auto !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      body {
        width: 72mm !important;
        min-height: 0 !important;
        height: auto !important;
        background: #fff !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: visible !important;
      }
      body > *:not(.receipt-print) { display: none !important; }
      .receipt-print {
        display: block !important;
        position: static !important;
        top: 0 !important;
        right: 0 !important;
        width: 72mm !important;
        margin: 0 !important;
        padding: 0 !important;
        box-sizing: border-box !important;
        direction: rtl !important;
        overflow: visible !important;
      }
      @page { margin: 0; size: auto; }
    }
  </style>
</head>
<body>

<div class="viewfinder-reticle"></div>

<div class="shift-container">

  <!-- Studio Header -->
  <div class="studio-brand">
    <div class="brand-aperture-wrap">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="10" />
        <line x1="14.31" y1="8" x2="20.05" y2="17.94" />
        <line x1="9.69" y1="8" x2="21.17" y2="8" />
        <line x1="7.38" y1="12" x2="13.12" y2="2.06" />
        <line x1="9.69" y1="16" x2="3.95" y2="6.06" />
        <line x1="14.31" y1="16" x2="2.83" y2="16" />
        <line x1="16.62" y1="12" x2="10.88" y2="21.94" />
      </svg>
    </div>
    <h1 class="studio-title">بدء وردية جديدة</h1>
    <div class="studio-tagline">تسجيل العهدة الافتتاحية وفتح الوردية للكاشير</div>
  </div>

  <div class="shift-card">
    <!-- User info -->
    <div class="shift-user-badge">
      <div class="shift-user-avatar" id="userAvatar">م</div>
      <div class="shift-user-info">
        <h3 id="userName">الكاشير</h3>
        <p id="userRole">كاشير الاستوديو</p>
      </div>
    </div>

    <!-- Opening cash field -->
    <div class="shift-field">
      <label for="openingCash">المبلغ النقدي المسلم (العهدة الافتتاحية)</label>
      <div class="shift-input-wrap">
        <input type="number" class="shift-input" id="openingCash"
               placeholder="0" value="0" min="0" step="0.01" autofocus />
        <span class="shift-currency-tag">جنيه</span>
      </div>
      <div class="shift-field-hint">
        أدخل المبلغ النقدي في الدرج قبل بدء تسجيل العمليات
      </div>
    </div>

    <button class="shift-btn" id="startBtn" onclick="startShift()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      <span>تأكيد وبدء الشيفت</span>
    </button>
  </div>

  <div class="shift-back-link">
    <a onclick="goBack()">تسجيل خروج والعودة لشاشة الدخول &larr;</a>
  </div>

  <div class="shift-time" id="clockDisplay"></div>
</div>

<div class="toast-container" id="toastContainer"></div>

<!-- Print Container -->
<div class="receipt-print" id="receiptPrint"></div>

<script src="js/shared/common.js"></script>
<script>
// ─── Load user info ──────────────────────────────────────────────────────────
async function loadUser() {
  const res = await window.auth.getSession();
  if (!res.success) {
    window.electron.navigate('login.html');
    return;
  }
  const user = res.data;
  document.getElementById('userName').textContent = user.employeeName || user.username;
  document.getElementById('userRole').textContent = user.role === 'admin' ? 'مدير النظام' : 'كاشير الاستوديو';
  document.getElementById('userAvatar').textContent = (user.employeeName || user.username).charAt(0);

  // Update sessionStorage
  sessionStorage.setItem('photoStudio_userId', user.userId);
  sessionStorage.setItem('photoStudio_employeeId', user.employeeId);
  sessionStorage.setItem('photoStudio_employeeName', user.employeeName);
  sessionStorage.setItem('photoStudio_username', user.username);
  sessionStorage.setItem('photoStudio_role', user.role);
}

// ─── Start shift ──────────────────────────────────────────────────────────────
async function startShift() {
  const btn = document.getElementById('startBtn');
  btn.disabled = true;

  const openingCash = parseFloat(document.getElementById('openingCash').value) || 0;

  try {
    const result = await window.shift.start(openingCash);

    if (!result.success) {
      showToast(result.error || 'حدث خطأ في فتح الشيفت', 'error');
      btn.disabled = false;
      return;
    }

    sessionStorage.setItem('photoStudio_shiftId', result.data.shiftId);

    if (result.data.alreadyOpen) {
      showToast('يوجد شيفت مفتوح بالفعل — تم الاستمرار', 'info');
    } else {
      showToast('تم بدء الشيفت بنجاح', 'success');
      
      const userName = document.getElementById('userName').textContent;
      const receiptHTML = `
        <div style="width:68mm;margin:0 auto;box-sizing:border-box;font-family:'Cairo',monospace;font-size:12px;color:#000;direction:rtl;padding:2mm;">
          <div style="text-align:center;font-size:18px;font-weight:900;margin-bottom:4px;">بدء شيفت جديد</div>
          <div style="border-top:1px dashed #000;margin:5px 0;"></div>
          <div style="display:flex;justify-content:space-between;margin-bottom:3px;"><span>رقم الشيفت:</span><span>${result.data.shiftId}</span></div>
          <div style="display:flex;justify-content:space-between;margin-bottom:3px;"><span>الكاشير:</span><span>${userName}</span></div>
          <div style="display:flex;justify-content:space-between;margin-bottom:3px;font-weight:bold;"><span>العهدة الافتتاحية:</span><span>${Number(openingCash).toLocaleString('ar-EG')} جنيه</span></div>
          <div style="border-top:1px dashed #000;margin:5px 0;"></div>
          <div style="text-align:center;font-size:10px;margin-top:10px;">وقت البدء: ${new Date().toLocaleString('ar-EG')}</div>
        </div>
      `;
      document.getElementById('receiptPrint').innerHTML = receiptHTML;
      await new Promise(r => setTimeout(r, 120));
      try { await window.electron.print(); } catch(e){}
      await new Promise(r => setTimeout(r, 500));
      document.documentElement.setAttribute('dir', 'rtl');
      document.documentElement.style.direction = '';
    }

    setTimeout(() => {
      window.electron.navigate('main-dashboard.html');
    }, 800);

  } catch (err) {
    showToast('حدث خطأ: ' + err.message, 'error');
    btn.disabled = false;
  }
}

// ─── Go back ──────────────────────────────────────────────────────────────────
async function goBack() {
  await window.auth.logout();
  sessionStorage.clear();
  window.electron.navigate('login.html');
}

// ─── Clock ────────────────────────────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  document.getElementById('clockDisplay').textContent =
    now.toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }) +
    ' • ' + now.toLocaleTimeString('ar-EG');
}
setInterval(updateClock, 1000);
updateClock();

// ─── Enter key ────────────────────────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') startShift();
});

// ─── Init ──────────────────────────────────────────────────────────────────
loadUser();
(async () => {
  const role = sessionStorage.getItem('photoStudio_role');
  if (role === 'admin') {
    showToast('بدء الشيفت مخصص للكاشير فقط', 'warning');
    setTimeout(() => window.electron.navigate('main-dashboard.html'), 1200);
  }
})();
</script>
</body>
</html>
