<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>نظام إدارة استوديو التصوير — الخدمات والأصناف</title>
  <link rel="stylesheet" href="../styles/global.css" />
  <script src="../node_modules/sweetalert2/dist/sweetalert2.all.min.js"></script>
  <style>
    .srv-layout { display: flex; height: 100vh; flex-direction: column; }
    .srv-body { flex: 1; display: flex; overflow: hidden; }
    
    /* Category Sidebar */
    .cat-sidebar {
      width: 240px;
      background: var(--card);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .cat-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-secondary);
    }
    .cat-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }
    .cat-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      margin-bottom: 6px;
      cursor: pointer;
      transition: all var(--transition);
      border: 1px solid transparent;
    }
    .cat-item:hover { background: var(--bg); border-color: var(--border); }
    .cat-item.active { background: var(--accent-light); border-color: var(--accent); color: var(--accent); font-weight: 700; }
    .cat-item-name { font-size: 13px; font-weight: 600; }
    .cat-item-actions { display: flex; gap: 4px; opacity: 0; transition: opacity var(--transition); }
    .cat-item:hover .cat-item-actions { opacity: 1; }
    
    /* Main Content */
    .srv-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      overflow-y: auto;
    }
    
    .barcode-display {
      font-family: monospace;
      background: rgba(0,0,0,0.05);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
<div class="srv-layout">

  <!-- Header -->
  <header class="app-header" style="flex-shrink:0;">
    <div style="display:flex; align-items:center; gap:12px;">
      
      <div>
        <div class="header-title">إدارة الخدمات والأصناف والأسعار</div>
        <div class="header-subtitle">إدارة التصنيفات، قوائم الأسعار، وتوليد أكواد الباركود</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-outline btn-sm" onclick="goBack()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
        رجوع للرئيسية
      </button>
    </div>
  </header>

  <div class="srv-body">
    
    <!-- Category Sidebar -->
    <div class="cat-sidebar">
      <div class="cat-header">
        <div style="font-size:14px;font-weight:700;color:var(--primary);margin-bottom:12px;">الأقسام الرئيسية</div>
        <div class="flex gap-2">
          <input type="text" id="newCatName" class="form-control" placeholder="اسم القسم الجديد" style="height:32px;font-size:12px;" />
          <button class="btn btn-accent btn-sm" onclick="addCategory()" style="padding:0 12px;white-space:nowrap;">إضافة</button>
        </div>
      </div>
      <div class="cat-list" id="categoryList">
        <!-- Categories rendered here -->
      </div>
    </div>

    <!-- Main Content -->
    <div class="srv-main">
      
      <!-- Quick Stats -->
      <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));gap:16px;margin-bottom:20px;">
        <div class="stat-card">
          <div class="stat-icon blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg></div>
          <div class="stat-body">
            <div class="stat-value" id="statTotalServices">0</div>
            <div class="stat-label">إجمالي الخدمات</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon gold"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></div>
          <div class="stat-body">
            <div class="stat-value" id="statTotalCategories">0</div>
            <div class="stat-label">عدد الأقسام</div>
          </div>
        </div>
      </div>

      <div class="flex justify-between items-center mb-4">
        <div>
          <div style="font-size:18px;font-weight:700;color:var(--primary);" id="currentCategoryTitle">جميع الخدمات</div>
          <div style="font-size:12px;color:var(--text-muted);" id="servicesCount">0 خدمة</div>
        </div>
        <div class="flex gap-3 items-center">
          <div class="search-bar" style="width:240px;">
            <input type="text" id="serviceSearch" placeholder="بحث باسم الخدمة أو الباركود..." oninput="renderServicesTable()" />
            <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </div>
          <button class="btn btn-success" onclick="openServiceModal()">+ خدمة جديدة</button>
        </div>
      </div>

      <div class="card" style="flex:1;display:flex;flex-direction:column;padding:0;overflow:hidden;">
        <div class="table-wrapper" style="flex:1;border:none;border-radius:0;">
          <table>
            <thead>
              <tr>
                <th style="width:40px;">#</th>
                <th>اسم الخدمة / الصنف</th>
                <th>النوع</th>
                <th>القسم</th>
                <th>الباركود</th>
                <th>سعر التكلفة</th>
                <th>سعر البيع</th>
                <th style="width:120px;">الإجراءات</th>
              </tr>
            </thead>
            <tbody id="servicesBody">
              <tr><td colspan="8" class="table-empty">جاري التحميل...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<!-- Service Modal -->
<div class="modal-overlay" id="serviceModal">
  <div class="modal" style="max-width: 660px; width: 92%; border-radius: 14px; overflow: hidden; background: #fff; box-shadow: 0 20px 50px rgba(0,0,0,0.25);">
    <div class="modal-header" style="background: var(--primary); color: #fff; padding: 16px 22px; display:flex; justify-content:space-between; align-items:center;">
      <div class="modal-title" id="serviceModalTitle" style="color: #fff; font-size: 17px; font-weight: 800;">
        إضافة صنف / خدمة جديدة
      </div>
      <button class="modal-close" style="color: #fff; font-size: 20px;" onclick="closeModal('serviceModal')">✕</button>
    </div>

    <div class="modal-body" style="padding: 24px; display:flex; flex-direction:column; gap: 18px;">
      <input type="hidden" id="srvId" />

      <!-- Row 1: النوع والقسم -->
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label" style="font-weight:700; font-size:13px; margin-bottom:6px; display:block;">النوع</label>
          <select id="srvTrackInv" class="form-control" onchange="toggleInvFields()" style="height:44px; font-size:14px; font-weight:600;">
            <option value="0">خدمة تصوير / عمل</option>
            <option value="1">بضاعة / منتج مادي</option>
          </select>
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label" style="font-weight:700; font-size:13px; margin-bottom:6px; display:block;">القسم</label>
          <select id="srvCat" class="form-control" style="height:44px; font-size:14px;">
            <option value="">اختر القسم</option>
          </select>
        </div>
      </div>

      <!-- Row 2: الاسم -->
      <div class="form-group" style="margin-bottom:0;">
        <label class="form-label" style="font-weight:700; font-size:13px; margin-bottom:6px; display:block;">اسم الصنف / الخدمة *</label>
        <input type="text" id="srvName" class="form-control" placeholder="اكتب اسم الصنف أو الخدمة هنا..." style="height:44px; font-size:15px; font-weight:600;" />
      </div>

      <!-- Row 3: الباركود -->
      <div class="form-group" style="margin-bottom:0;">
        <label class="form-label" style="font-weight:700; font-size:13px; margin-bottom:6px; display:block;">الباركود</label>
        <div style="display:flex; gap:10px; align-items:center;">
          <input type="text" id="srvBarcode" class="form-control" placeholder="امسح الباركود أو اتركه للتوليد" style="height:44px; font-size:14px; font-family:monospace; flex:1;" />
          <button type="button" class="btn btn-outline" onclick="generateBarcode()" style="height:44px; padding:0 18px; font-weight:700; white-space:nowrap;">توليد كود</button>
        </div>
        <label style="display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-muted); cursor:pointer; margin-top:6px;">
          <input type="checkbox" id="autoGenerateBarcode" style="width:15px; height:15px;" />
          <span>توليد باركود تلقائياً عند الإضافة</span>
        </label>
      </div>

      <!-- Row 4: الأسعار -->
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label" style="font-weight:700; font-size:13px; margin-bottom:6px; display:block;">سعر التكلفة (ج.م)</label>
          <input type="number" id="srvCost" class="form-control" placeholder="0.00" step="0.5" style="height:44px; font-size:15px; font-weight:600;" />
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label" style="font-weight:700; font-size:13px; margin-bottom:6px; display:block; color:var(--primary);">سعر البيع (ج.م) *</label>
          <input type="number" id="srvSell" class="form-control" placeholder="0.00" step="0.5" style="height:44px; font-size:16px; font-weight:800; color:#059669;" />
        </div>
      </div>

      <!-- Row 5: المخزون (للبضائع المادية فقط) -->
      <div id="invFieldsRow" style="display:none; grid-template-columns: 1fr 1fr; gap: 16px; padding:14px; background:#F8FAFC; border:1px solid var(--border); border-radius:10px;">
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label" style="font-weight:700; font-size:13px; margin-bottom:6px; display:block;">الكمية المتوفرة بالمخزن</label>
          <input type="number" id="srvQty" class="form-control" placeholder="0" min="0" value="0" style="height:42px; font-size:15px; font-weight:700;" />
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label" style="font-weight:700; font-size:13px; margin-bottom:6px; display:block;">حد التنبيه عند النقص</label>
          <input type="number" id="srvLowThreshold" class="form-control" placeholder="0" min="0" value="0" style="height:42px; font-size:15px; font-weight:700;" />
        </div>
      </div>

    </div>

    <div class="modal-footer" style="padding: 16px 22px; background: var(--bg); border-top: 1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
      <button class="btn btn-outline" onclick="closeModal('serviceModal')" style="padding:10px 24px; font-weight:700;">إلغاء</button>
      <button class="btn btn-success" onclick="saveService()" style="padding:10px 32px; font-weight:800; font-size:15px;">حفظ الصنف</button>
    </div>
  </div>
</div>

<script>
let categories = [];
let allServices = [];
let currentCategoryId = 0; // 0 = All

function navigate(page){ window.electron.navigate(page); }
function goBack(){ window.electron.navigate('main-dashboard.html'); }

function showToast(msg,type='success'){
  const c=document.getElementById('toastContainer');
  const t=document.createElement('div');
  t.className=`toast toast-${type}`;
  t.innerHTML=`<span>${type==='success'?'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>':type==='error'?'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>':'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 9v2m0 4h.01M12 3l9 16H3L12 3z"/></svg>'}</span> ${msg}`;
  c.appendChild(t);
  setTimeout(()=>{t.style.animation='toastOut 0.3s ease forwards';setTimeout(()=>t.remove(),300);},3000);
}

function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
function fmt(n){ return Number(n||0).toFixed(2); }

// ─── Categories ───────────────────────────────────────────────────────────────
async function loadCategories() {
  const res = await window.db.query('SELECT * FROM service_categories ORDER BY id',[]);
  if(res.success){
    categories = res.data;
    renderCategories();
    populateCategorySelect();
  }
}

function renderCategories() {
  const container = document.getElementById('categoryList');
  let html = `
    <div class="cat-item ${currentCategoryId===0?'active':''}" onclick="selectCategory(0, 'جميع الخدمات')">
      <div class="cat-item-name">الكل</div>
    </div>
  `;
  categories.forEach(c => {
    html += `
      <div class="cat-item ${currentCategoryId===c.id?'active':''}" onclick="selectCategory(${c.id}, '${c.name.replace(/'/g,"\\'")}')">
        <div class="cat-item-name">${c.name}</div>
        <div class="cat-item-actions">
          <button class="btn btn-sm btn-danger" style="padding:0 6px;height:22px;font-size:10px;" onclick="event.stopPropagation();deleteCategory(${c.id})">✕</button>
        </div>
      </div>
    `;
  });
  container.innerHTML = html;
}

function selectCategory(id, name) {
  currentCategoryId = id;
  document.getElementById('currentCategoryTitle').textContent = name;
  renderCategories(); // update active class
  renderServicesTable();
}

async function addCategory() {
  const name = document.getElementById('newCatName').value.trim();
  if(!name){ showToast('يرجى إدخال اسم القسم','error'); return; }
  const res = await window.db.run('INSERT INTO service_categories (name) VALUES (?)',[name]);
  if(res.success){
    showToast('تم إضافة القسم ','success');
    document.getElementById('newCatName').value='';
    await loadCategories();
  } else showToast('خطأ: '+res.error,'error');
}

async function deleteCategory(id) {
  const result = await Swal.fire({
    title: 'تأكيد حذف القسم',
    text: 'هل أنت متأكد من حذف هذا القسم؟ (لن يتم حذف الخدمات المرتبطة به ولكن ستفقد تصنيفها)',
    icon: 'warning',
    showCancelButton: true,
    confirmButtonColor: '#E05252',
    cancelButtonColor: '#94A3B8',
    confirmButtonText: 'نعم، احذف',
    cancelButtonText: 'إلغاء'
  });
  if (!result.isConfirmed) return;
  await window.db.run('DELETE FROM service_categories WHERE id=?',[id]);
  await window.db.run('UPDATE services SET category_id=NULL WHERE category_id=?',[id]);
  if(currentCategoryId===id) currentCategoryId=0;
  await loadCategories();
  await loadServices();
  showToast('تم الحذف','success');
}

function populateCategorySelect() {
  const sel = document.getElementById('srvCat');
  sel.innerHTML = '<option value="">اختر القسم</option>';
  categories.forEach(c => {
    sel.innerHTML += `<option value="${c.id}">${c.name}</option>`;
  });
}

async function loadServices() {
  const res = await window.db.query(
    'SELECT s.*, c.name as cat_name FROM services s LEFT JOIN service_categories c ON s.category_id=c.id ORDER BY s.id DESC',[]
  );
  if(res.success){
    allServices = res.data;
    
    // Update stats
    document.getElementById('statTotalServices').textContent = allServices.length;
    document.getElementById('statTotalCategories').textContent = categories.length;

    renderServicesTable();
  }
}

function renderServicesTable() {
  const tbody = document.getElementById('servicesBody');
  const query = document.getElementById('serviceSearch').value.trim().toLowerCase();
  
  let filtered = allServices;
  
  // Filter by category
  if(currentCategoryId !== 0){
    filtered = filtered.filter(s => s.category_id === currentCategoryId);
  }
  
  // Filter by search
  if(query){
    filtered = filtered.filter(s => 
      s.name.toLowerCase().includes(query) || 
      (s.barcode && s.barcode.toLowerCase().includes(query))
    );
  }
  
  document.getElementById('servicesCount').textContent = `${filtered.length} خدمة`;
  
  if(!filtered.length){
    tbody.innerHTML = '<tr><td colspan="8" class="table-empty">لا توجد خدمات مطابقة</td></tr>';
    return;
  }
  
  tbody.innerHTML = filtered.map((s,i) => {
    const isProd = s.track_inventory === 1;
    const typeBadge = isProd
      ? `<span class="badge" style="background:#FEF3C7;color:#D97706;font-size:11px;font-weight:700;">بضاعة (${s.quantity||0})</span>`
      : `<span class="badge" style="background:#E0F2FE;color:#0284C7;font-size:11px;font-weight:700;">خدمة</span>`;

    return `
    <tr>
      <td style="color:var(--text-muted);">${i+1}</td>
      <td style="font-weight:700;">${s.name}</td>
      <td>${typeBadge}</td>
      <td><span class="badge badge-accent">${s.cat_name||'بدون قسم'}</span></td>
      <td>${s.barcode?`<span class="barcode-display">${s.barcode}</span>`:'—'}</td>
      <td style="color:var(--danger);">${fmt(s.cost_price)}</td>
      <td style="color:var(--success);font-weight:700;font-size:14px;">${fmt(s.sell_price)}</td>
      <td>
        <div class="flex gap-2">
          <button class="btn btn-sm btn-outline" onclick="editService(${s.id})">تعديل</button>
          <button class="btn btn-sm btn-danger" onclick="deleteService(${s.id})">حذف</button>
        </div>
      </td>
    </tr>
  `;
  }).join('');
}

function toggleInvFields() {
  const isProd = document.getElementById('srvTrackInv').value === '1';
  document.getElementById('invFieldsRow').style.display = isProd ? 'grid' : 'none';
}

function openServiceModal() {
  document.getElementById('serviceModalTitle').textContent = 'إضافة صنف / خدمة جديدة';
  document.getElementById('srvId').value = '';
  document.getElementById('srvTrackInv').value = '0';
  toggleInvFields();
  document.getElementById('srvName').value = '';
  document.getElementById('srvCat').value = currentCategoryId===0?'':currentCategoryId;
  document.getElementById('srvCost').value = '';
  document.getElementById('srvSell').value = '';
  document.getElementById('srvQty').value = '0';
  document.getElementById('srvLowThreshold').value = '0';

  const autoGen = localStorage.getItem('auto_gen_barcode') === 'true';
  const autoGenChk = document.getElementById('autoGenerateBarcode');
  if (autoGenChk) autoGenChk.checked = autoGen;

  if (autoGen) {
    generateBarcode();
  } else {
    document.getElementById('srvBarcode').value = '';
  }

  openModal('serviceModal');
  setTimeout(() => document.getElementById('srvName').focus(), 150);
}

function generateBarcode() {
  const rand = Math.floor(1000000000 + Math.random() * 9000000000);
  document.getElementById('srvBarcode').value = rand;
}

function initBarcodeAutoToggle() {
  const chk = document.getElementById('autoGenerateBarcode');
  if (!chk) return;
  chk.checked = localStorage.getItem('auto_gen_barcode') === 'true';
  chk.addEventListener('change', function() {
    localStorage.setItem('auto_gen_barcode', this.checked);
    if (this.checked && !document.getElementById('srvBarcode').value.trim()) {
      generateBarcode();
    }
  });
}

async function saveService() {
  const id = document.getElementById('srvId').value;
  const trackInv = parseInt(document.getElementById('srvTrackInv').value) || 0;
  const name = document.getElementById('srvName').value.trim();
  const catId = document.getElementById('srvCat').value || null;
  let barcode = document.getElementById('srvBarcode').value.trim() || null;
  const autoGen = document.getElementById('autoGenerateBarcode')?.checked;
  if (!barcode && autoGen) {
    generateBarcode();
    barcode = document.getElementById('srvBarcode').value.trim();
  }
  const cost = parseFloat(document.getElementById('srvCost').value) || 0;
  const sell = parseFloat(document.getElementById('srvSell').value) || 0;
  const qty = parseFloat(document.getElementById('srvQty').value) || 0;
  const lowThresh = parseFloat(document.getElementById('srvLowThreshold').value) || 0;
  
  if(!name || sell <= 0){
    showToast('يرجى إدخال اسم الخدمة وسعر البيع','error');
    return;
  }
  
  // Check barcode uniqueness
  if(barcode){
    const checkRes = await window.db.queryOne('SELECT id FROM services WHERE barcode=? AND id!=?',[barcode, id||-1]);
    if(checkRes.success && checkRes.data){
      showToast('هذا الباركود مستخدم لخدمة أخرى','error');
      return;
    }
  }
  
  let res;
  if(id){
    res = await window.db.run(
      'UPDATE services SET category_id=?, name=?, barcode=?, sell_price=?, cost_price=?, track_inventory=?, quantity=?, low_stock_threshold=? WHERE id=?',
      [catId, name, barcode, sell, cost, trackInv, qty, lowThresh, id]
    );
  } else {
    res = await window.db.run(
      'INSERT INTO services (category_id, name, barcode, sell_price, cost_price, track_inventory, quantity, low_stock_threshold) VALUES (?,?,?,?,?,?,?,?)',
      [catId, name, barcode, sell, cost, trackInv, qty, lowThresh]
    );
  }
  
  if(res.success){
    await loadServices();
    if(id){
      // تعديل → أغلق المودال
      showToast('تم تعديل الخدمة بنجاح', 'success');
      closeModal('serviceModal');
    } else {
      // إضافة جديدة → ابقَ مفتوحاً، صفِّ الحقول، استعد للتالي
      showToast('تمت إضافة الصنف بنجاح — جاهز للصنف التالي', 'success');
      // تصفية الحقول القابلة للتكرار
      document.getElementById('srvName').value = '';
      document.getElementById('srvCost').value = '';
      document.getElementById('srvSell').value = '';
      document.getElementById('srvQty').value = '0';
      document.getElementById('srvLowThreshold').value = '0';
      document.getElementById('srvId').value = '';

      if (autoGen) {
        generateBarcode();
      } else {
        document.getElementById('srvBarcode').value = '';
      }
      // ضع المؤشر على حقل الاسم تلقائياً
      document.getElementById('srvName').focus();
    }
  } else {
    showToast('خطأ: '+res.error,'error');
  }
}

function editService(id) {
  const s = allServices.find(x=>x.id===id);
  if(!s) return;
  document.getElementById('serviceModalTitle').textContent = 'تعديل: ' + s.name;
  document.getElementById('srvId').value = s.id;
  document.getElementById('srvTrackInv').value = s.track_inventory ? '1' : '0';
  toggleInvFields();
  document.getElementById('srvName').value = s.name;
  document.getElementById('srvCat').value = s.category_id || '';
  document.getElementById('srvBarcode').value = s.barcode || '';
  document.getElementById('srvCost').value = s.cost_price;
  document.getElementById('srvSell').value = s.sell_price;
  document.getElementById('srvQty').value = s.quantity || 0;
  document.getElementById('srvLowThreshold').value = s.low_stock_threshold || 0;
  openModal('serviceModal');
}

async function deleteService(id) {
  const result = await Swal.fire({
    title: 'تأكيد حذف الخدمة',
    text: 'هل أنت متأكد من حذف هذه الخدمة نهائياً؟',
    icon: 'warning',
    showCancelButton: true,
    confirmButtonColor: '#E05252',
    cancelButtonColor: '#94A3B8',
    confirmButtonText: 'نعم، احذف',
    cancelButtonText: 'إلغاء'
  });
  if (!result.isConfirmed) return;
  await window.db.run('DELETE FROM services WHERE id=?',[id]);
  showToast('تم الحذف','success');
  await loadServices();
}

// ─── Admin Check & Quit ───────────────────────────────────────────────────────
async function checkAdmin() {
  const role = sessionStorage.getItem('photoStudio_role');
  if (role !== 'admin') {
    showToast('هذه الصفحة متاحة للمدير فقط', 'error');
    setTimeout(() => goBack(), 1000);
    return false;
  }
  return true;
}

window.electron.onConfirmBackupBeforeQuit(() => {
  Swal.fire({
    title: 'إغلاق البرنامج', text: 'هل تريد إنشاء نسخة احتياطية قبل الخروج؟', icon: 'question',
    showDenyButton: true, showCancelButton: true, confirmButtonText: 'نسخ وخروج', denyButtonText: 'خروج بدون نسخة', cancelButtonText: 'إلغاء'
  }).then((r) => {
    if (r.isConfirmed) window.electron.quitWithBackup();
    else if (r.isDenied) window.electron.quitWithoutBackup();
    else window.electron.cancelQuit();
  });
});

// ─── Init ─────────────────────────────────────────────────────────────────────
async function init() {
  initBarcodeAutoToggle();
  const isAdmin = await checkAdmin();
  if (isAdmin) {
    await loadCategories();
    await loadServices();
  }
}

init();
</script>
